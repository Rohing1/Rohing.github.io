<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860" role="img" aria-labelledby="title desc">
  <title id="title">42U 网络机柜正面布局示意图</title>
  <desc id="desc">展示光纤配线架、铜缆配线架、理线架、接入交换机、汇聚设备、PDU、UPS 和预留空间的推荐相对位置。</desc>
  <style>
    .bg{fill:#f8fafc}.frame{fill:#fff;stroke:#193b68;stroke-width:5}.u{stroke:#d8e2ee;stroke-width:1}.t{font-family:'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#173b69}.h{font-size:30px;font-weight:700}.l{font-size:20px;font-weight:600}.s{font-size:16px;fill:#476789}.note{font-size:17px;fill:#2f587f}.device{stroke-width:2}.fiber{fill:#e8f4ff;stroke:#2f80c3}.copper{fill:#fff3dd;stroke:#d88d1e}.manager{fill:#eef2f7;stroke:#778aa0}.switch{fill:#e6f8f1;stroke:#169b75}.core{fill:#ece9ff;stroke:#6d50d8}.blank{fill:#f9fbfd;stroke:#aab8c7;stroke-dasharray:7 5}.power{fill:#fff0f1;stroke:#d65462}.ups{fill:#fce9e9;stroke:#a8323f}.legend{fill:#fff;stroke:#d3dde8;stroke-width:1.5}
  </style>
  <rect class="bg" width="1080" height="860" rx="18"/>
  <text x="50" y="60" class="t h">42U 网络机柜正面布局示意（推荐相对位置）</text>
  <text x="50" y="90" class="t s">实际 U 位、承重、散热与安装方式以设备厂商手册和项目设计为准</text>
  <rect x="150" y="125" width="430" height="665" rx="8" class="frame"/>
  <rect x="180" y="150" width="370" height="60" rx="5" class="fiber device"/>
  <text x="365" y="186" text-anchor="middle" class="t l">U42–U39　ODF / 光纤配线架</text>
  <rect x="180" y="220" width="370" height="55" rx="5" class="copper device"/>
  <text x="365" y="253" text-anchor="middle" class="t l">U38–U36　铜缆配线架 PP01</text>
  <rect x="180" y="285" width="370" height="34" rx="4" class="manager device"/>
  <text x="365" y="308" text-anchor="middle" class="t l">U35　水平理线架</text>
  <rect x="180" y="329" width="370" height="58" rx="5" class="switch device"/>
  <text x="365" y="364" text-anchor="middle" class="t l">U34–U32　接入交换机 SW01</text>
  <rect x="180" y="397" width="370" height="34" rx="4" class="manager device"/>
  <text x="365" y="420" text-anchor="middle" class="t l">U31　水平理线架</text>
  <rect x="180" y="441" width="370" height="76" rx="5" class="core device"/>
  <text x="365" y="473" text-anchor="middle" class="t l">U30–U27　汇聚/路由/防火墙</text>
  <text x="365" y="497" text-anchor="middle" class="t s">按散热方向留空位或盲板</text>
  <rect x="180" y="527" width="370" height="89" rx="5" class="blank device"/>
  <text x="365" y="564" text-anchor="middle" class="t l">U26–U21　扩容与散热预留</text>
  <text x="365" y="589" text-anchor="middle" class="t s">不作为临时线缆堆放区</text>
  <rect x="180" y="626" width="370" height="45" rx="5" class="power device"/>
  <text x="365" y="654" text-anchor="middle" class="t l">U20–U19　后部 PDU A/B 路</text>
  <rect x="180" y="681" width="370" height="82" rx="5" class="ups device"/>
  <text x="365" y="716" text-anchor="middle" class="t l">U18–U1　UPS / 电池等重型设备</text>
  <text x="365" y="740" text-anchor="middle" class="t s">底部安装，核对承重与通风</text>
  <text x="116" y="177" class="t s">顶部</text><text x="100" y="752" class="t s">底部</text>
  <rect x="640" y="135" width="380" height="250" rx="10" class="legend"/>
  <text x="670" y="175" class="t h" style="font-size:24px">前后部走线分工</text>
  <text x="675" y="215" class="t note">正面：铜缆跳线、水平/竖向理线架</text>
  <text x="675" y="252" class="t note">后部：PDU、电源线、设备维护线</text>
  <text x="675" y="289" class="t note">侧部：竖向理线槽；光纤走专用通道</text>
  <text x="675" y="326" class="t note">两端：所有跳线均贴可读双端标签</text>
  <rect x="640" y="425" width="380" height="280" rx="10" class="legend"/>
  <text x="670" y="465" class="t h" style="font-size:24px">交付时必须留下</text>
  <text x="675" y="505" class="t note">1. 机柜正反面照片与 U 位图</text>
  <text x="675" y="542" class="t note">2. 端口映射：信息点—PP—交换机</text>
  <text x="675" y="579" class="t note">3. 上联、A/B 电源、PoE 与 VLAN 台账</text>
  <text x="675" y="616" class="t note">4. 配置备份、测试结果与变更记录</text>
  <text x="675" y="653" class="t note">5. 颜色说明与故障升级联系人</text>
  <text x="640" y="760" class="t s">提示：图示仅用于规划。PDU 常安装于后部竖向位置；</text>
  <text x="640" y="790" class="t s">高压供电、接地和消防施工应由具备资质人员完成。</text>
</svg>
