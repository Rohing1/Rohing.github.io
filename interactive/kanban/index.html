<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻量待办看板 · wiki.982013.xyz</title><meta name="description" content="浏览器本地待办看板，支持任务拖动、截止日期、优先级、筛选和备份导出。"><link rel="stylesheet" href="../common3860.css?v=1"><link rel="stylesheet" href="kanban3860.css?v=1"><script defer src="../common3860.js?v=1"></script><script defer src="../backup.20260927.js"></script><script defer src="kanban.20260926-2.backup1.js"></script><link rel="stylesheet" href="../backup.20260927.css"><link rel="stylesheet" href="../workbench.20261005322c.css?v=20261005c"><script defer src="../workbench.20261005322c.js?v=20261005c"></script><link rel="stylesheet" href="../share.202610136bc8.css?v=20261013"><script defer src="../share.202610136bc8.js?v=20261013"></script><link id="yj-site-assistant-style" rel="stylesheet" href="../../assets/static/site-assistant-b2736bde5428.css">
<script id="yj-site-assistant-script" defer src="../../assets/static/site-assistant-348c89d16580.js" data-yj-index="../../assets/static/site-assistant-index-fddb845fd1ab.json" data-yj-worker="../../assets/static/site-assistant-worker-c3769b27ff9a.js"></script>
<link rel="stylesheet" href="../guide.202610136bc8.css?v=20261013"><script defer src="../guide.202610136bc8.js?v=20261013"></script></head><body>
<header class="topbar"><div class="brand">☷ 轻量待办看板</div><a href="https://wiki.982013.xyz/">返回文章网站 ↗</a></header><main class="shell"><div class="intro"><div><span class="eyebrow">Less clutter · More progress</span><h1>把事情理顺，把进展看见。</h1><p class="description">从待处理到已完成，给任务一个清晰的位置。拖动卡片，或在卡片内直接切换状态。</p></div><button id="add" class="primary">＋ 新建任务</button></div>
<section class="panel filters"><div class="row"><input id="search" type="search" placeholder="搜索标题、备注或标签" aria-label="搜索任务"><select id="priority-filter" aria-label="筛选优先级"><option value="all">全部优先级</option><option value="high">高优先级</option><option value="normal">普通优先级</option><option value="low">低优先级</option></select><select id="date-filter" aria-label="筛选截止日期"><option value="all">全部日期</option><option value="overdue">已逾期（未完成）</option><option value="today">今日到期</option><option value="none">未设日期</option></select><button id="reset-filter">清除筛选</button><button id="undo" disabled>撤销上次操作</button></div><div class="row between"><span id="overview" class="hint"></span><label class="check"><input id="remember" type="checkbox" checked>在此浏览器自动保存任务</label></div><div id="save-status" class="hint">任务默认自动保存在当前浏览器，关闭后重新打开可继续使用。无痕窗口关闭、清理网站数据或换设备时，需要使用导出的备份恢复。</div></section>
<section class="board" aria-label="待办看板"><div class="column" data-column="todo"><header><span class="dot todo"></span><h2>待处理</h2><span id="count-todo"></span><button data-add="todo" aria-label="新增待处理任务">＋</button></header><div id="todo" class="task-list" data-drop="todo"></div></div><div class="column" data-column="doing"><header><span class="dot doing"></span><h2>进行中</h2><span id="count-doing"></span><button data-add="doing" aria-label="新增进行中任务">＋</button></header><div id="doing" class="task-list" data-drop="doing"></div></div><div class="column" data-column="done"><header><span class="dot done"></span><h2>已完成</h2><span id="count-done"></span><button data-add="done" aria-label="新增已完成任务">＋</button></header><div id="done" class="task-list" data-drop="done"></div></div></section>
<section class="panel backup"><div class="row"><button id="export" class="primary">导出任务备份</button><label class="button file-button">导入任务备份<input id="import" type="file" accept=".json,application/json" aria-label="导入任务备份"></label><button id="clear" class="danger">清空看板与本地记录</button></div><div id="status" class="status" role="status"></div><p class="hint">任务不会上传，没有多人同步。换设备或清理浏览器之前，请导出 JSON 备份；任务可能包含个人信息，请妥善保管备份。</p></section><footer class="footer">简洁工作，稳步推进 · wiki.982013.xyz</footer></main>
<dialog id="task-dialog"><form id="task-form"><h2 id="dialog-title">新建任务</h2><div class="stack"><label>任务标题<input id="task-title" required maxlength="160" placeholder="例如：整理本周工作计划"></label><label>备注<textarea id="task-note" rows="4" maxlength="5000"></textarea></label><div class="grid2"><label>状态<select id="task-state"><option value="todo">待处理</option><option value="doing">进行中</option><option value="done">已完成</option></select></label><label>优先级<select id="task-priority"><option value="normal">普通</option><option value="high">高</option><option value="low">低</option></select></label><label>截止日期<input id="task-due" type="date"></label><label>标签（用逗号分隔）<input id="task-tags" maxlength="200" placeholder="工作, 学习"></label></div></div><div class="row"><button type="submit" class="primary">保存任务</button><button id="cancel-task" type="button">取消</button><button id="delete-task" type="button" class="danger" hidden>删除任务</button></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="row"><button id="cancel-confirm">取消</button><button id="accept-confirm" class="danger">确认</button></div></dialog></body>
